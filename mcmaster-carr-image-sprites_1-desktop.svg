  <title>Gambar digabung lalu dipecah lagi, versi desktop</title>
  <desc>Lima gambar terpisah, yaitu baut, mur, paku, ring, dan sekrup, biasanya butuh lima request. sprite_builder.py menumpuk kelimanya dari atas ke bawah jadi satu file, sprite.webp. Di halaman, CSS menggeser file itu ke posisi 0%, 25%, 50%, 75%, dan 100%, jadi tiap span cuma menampilkan potongannya sendiri. Lima gambar, satu file, satu request.</desc>
