<svg width="100%" viewBox="0 0 700 330" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur swap lane, versi desktop</title>
  <desc>Lane ditarik lalu dilepas di slot baru. Tiap kali lane dipindah, frontend langsung menggeser lane di layar, mengirim id lane dan posisi barunya, lalu server menomori ulang semua lane di board. Kalau berhasil, board dimuat ulang dengan urutan baru. Kalau gagal, urutan lama kembali.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Drag lane</text>
  <text x="130" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Lepas di slot baru</text>
  <path d="M130 76V110" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="26" y="112" width="648" height="106" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="40" y="130" dominant-baseline="central" font-size="12" fill="#52514E">↻ Tiap kali lane dipindah</text>
  <rect x="40" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Geser di layar</text>
  <text x="130" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Tanpa nunggu server</text>
  <path d="M220 174H258" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="260" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Kirim posisi</text>
  <text x="350" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Cuma id + posisi baru</text>
  <path d="M440 174H478" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="480" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="570" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Susun ulang</text>
  <text x="570" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Server nomori semua lane</text>
  <path d="M350 218V252" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="298" y="254" width="104" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="350" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Gagal</text>
  <text x="350" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Urutan balik</text>
  <path d="M570 202V252" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="480" y="254" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="570" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Urutan tersimpan</text>
  <text x="570" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Board dimuat ulang</text>
</svg>
