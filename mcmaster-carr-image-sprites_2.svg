  <text x="130" y="616" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">build_html()</text>
  <text x="130" y="634" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Satu span per gambar</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
