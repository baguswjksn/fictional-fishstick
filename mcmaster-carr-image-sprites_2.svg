  <text x="130" y="458" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Tumpuk jadi satu file</text>
  <path d="M130 478V508" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="30" y="510" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
