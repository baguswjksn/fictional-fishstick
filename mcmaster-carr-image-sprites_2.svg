  <text x="130" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">collect()</text>
  <text x="130" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Ambil + urutkan</text>
  <path d="M130 164V228" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="16" y="196" width="348" height="196" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="30" y="214" text-anchor="start" dominant-baseline="central" font-size="12" fill="#52514E">↻ Tiap gambar</text>
  <rect x="30" y="230" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">load_rgba()</text>
  <text x="130" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Buka gambarnya</text>
