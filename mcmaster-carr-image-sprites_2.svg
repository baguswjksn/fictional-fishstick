  <rect x="260" y="230" width="96" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="308" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">[lewati]</text>
  <text x="308" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">File rusak</text>
  <path d="M130 286V316" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="30" y="318" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
