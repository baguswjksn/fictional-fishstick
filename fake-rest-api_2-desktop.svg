<svg width="100%" viewBox="0 0 700 330" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur teknis Fake REST API, versi desktop</title>
  <desc>index.php menerima request, route() mengatur CORS dan OPTIONS, simulate() menangani delay dan status. Untuk setiap request API, api() mencocokkan nama dan id, find() mengambil data dari SQLite, send_list() atau pick() menyusun respons, lalu send() membalas JSON. Request tulis lewat save_items(). Jika tidak ada, dibalas 404.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">index.php</text>
  <text x="130" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Terima request</text>
  <path d="M220 48H258" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="260" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">route()</text>
  <text x="350" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">CORS, OPTIONS → 204</text>
  <path d="M440 48H478" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="480" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="570" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">simulate()</text>
  <text x="570" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">?delay, ?status</text>
  <path d="M570 76V98H130V110" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="16" y="112" width="428" height="106" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="30" y="130" dominant-baseline="central" font-size="12" fill="#52514E">↻ Untuk setiap request API</text>
  <rect x="40" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">api()</text>
  <text x="130" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Cocokkan nama + id</text>
  <path d="M220 174H258" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="260" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">find()</text>
  <text x="350" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Ambil dari SQLite</text>
  <path d="M440 174H478" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M350 218V252" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="298" y="254" width="104" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="350" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Tidak ada</text>
  <text x="350" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Balas 404</text>
  <rect x="480" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="570" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">send_list()</text>
  <text x="570" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">limit, skip, q, select</text>
  <path d="M570 202V252" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="480" y="254" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="570" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Respons JSON</text>
  <text x="570" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Seperti API beneran</text>
</svg>
