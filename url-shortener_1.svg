<svg width="100%" viewBox="0 0 380 594" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur utama penyingkat link, versi mobile</title>
  <desc>Pemilik login ke dashboard, membuat link pendek dari link panjang, lalu membagikannya. Setiap kali link pendek diklik, sistem mencari link aslinya dan mengarahkan pengunjung ke situs tujuan. Jika link tidak ditemukan, muncul error 404.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>

  <!-- 1. Login -->
  <rect x="30" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Pemilik login</text>
  <text x="130" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Masuk ke dashboard</text>

  <line x1="130" y1="76" x2="130" y2="106" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Buat link pendek -->
  <rect x="30" y="108" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Buat link pendek</text>
  <text x="130" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Tempel link panjang</text>

  <line x1="130" y1="164" x2="130" y2="194" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Bagikan -->
  <rect x="30" y="196" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Bagikan</text>
  <text x="130" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Kirim link pendek ke orang</text>

  <line x1="130" y1="252" x2="130" y2="286" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bagian yang berulang -->
  <rect x="16" y="288" width="228" height="194" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="30" y="306" dominant-baseline="central" font-size="12" fill="#52514E">↻ Setiap kali link pendek diklik</text>

  <!-- 4. Pengunjung klik -->
  <rect x="30" y="322" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="340" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Pengunjung klik</text>
  <text x="130" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Buka link pendek</text>

  <line x1="130" y1="378" x2="130" y2="408" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Cari link asli -->
  <rect x="30" y="410" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="428" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Cari link asli</text>
  <text x="130" y="446" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Jumlah klik ikut dicatat</text>

  <!-- Cabang gagal -->
  <line x1="244" y1="438" x2="258" y2="438" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="260" y="410" width="104" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="312" y="428" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Tidak ada</text>
  <text x="312" y="446" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Error 404</text>

  <line x1="130" y1="466" x2="130" y2="516" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Situs tujuan -->
  <rect x="30" y="518" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="536" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Situs tujuan</text>
  <text x="130" y="554" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Pengunjung diarahkan</text>
</svg>
