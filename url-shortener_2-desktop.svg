<svg width="100%" viewBox="0 0 680 330" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur teknis saat link pendek dibuka, versi desktop</title>
  <desc>public/index.php menerima request GET ke sebuah kode. Untuk setiap request, Router::dispatch() mencocokkan pola URL, LinkController::follow() dipanggil, lalu recordClick() menambah hitungan klik dan mengambil target_url dari SQLite. Jika kode tidak ditemukan, not_found() mengembalikan 404. Jika ada, server membalas 302 ke target_url.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">public/index.php</text>
  <text x="120" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Terima GET /print</text>
  <path d="M120 76V110" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="16" y="112" width="648" height="106" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="30" y="130" dominant-baseline="central" font-size="12" fill="#52514E">↻ Untuk setiap request link pendek</text>
  <rect x="30" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="120" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Router::dispatch()</text>
  <text x="120" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Cocokkan pola /{kode}</text>
  <path d="M210 174H248" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="250" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">follow()</text>
  <text x="340" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Handler di LinkController</text>
  <path d="M430 174H468" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="470" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="560" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">recordClick()</text>
  <text x="560" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">clicks + 1, ambil target_url</text>
  <path d="M600 202V252" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="510" y="254" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="580" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">302 Location</text>
  <text x="580" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Ke target_url</text>
  <path d="M520 218V234H444V252" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="366" y="254" width="104" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="418" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">not_found()</text>
  <text x="418" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Balas 404</text>
</svg>
