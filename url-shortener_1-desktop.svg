<svg width="100%" viewBox="0 0 680 330" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur utama penyingkat link, versi desktop</title>
  <desc>Pemilik login ke dashboard, membuat link pendek dari link panjang, lalu membagikannya. Setiap kali link pendek diklik, sistem mencari link aslinya dan mengarahkan pengunjung ke situs tujuan. Jika link tidak ditemukan, muncul error 404.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Pemilik login</text>
  <text x="120" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Masuk ke dashboard</text>
  <path d="M210 48H248" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="250" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Buat link pendek</text>
  <text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Tempel link panjang</text>
  <path d="M430 48H468" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="470" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="560" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Bagikan</text>
  <text x="560" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Kirim link pendek ke orang</text>
  <path d="M560 76V98H120V118" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="16" y="120" width="428" height="106" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="30" y="138" dominant-baseline="central" font-size="12" fill="#52514E">↻ Setiap kali link pendek diklik</text>
  <rect x="30" y="154" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="120" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Pengunjung klik</text>
  <text x="120" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Buka link pendek</text>
  <path d="M210 182H248" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="250" y="154" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Cari link asli</text>
  <text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Jumlah klik ikut dicatat</text>
  <path d="M430 182H468" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="470" y="154" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="560" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Situs tujuan</text>
  <text x="560" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Pengunjung diarahkan</text>
  <path d="M340 226V252" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="288" y="254" width="104" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Tidak ada</text>
  <text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Error 404</text>
</svg>
