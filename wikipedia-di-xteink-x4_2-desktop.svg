<svg width="100%" viewBox="0 0 700 188" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Tahapan di dalam convert(), versi desktop</title>
  <desc>convert menjalankan clean_html, split_chapters, render_chapters, lalu write_epub. render_chapters memakai ImageStore.get untuk gambar, dan write_epub memakai make_cover untuk sampul.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>
  <rect x="14" y="20" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="89" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">clean_html()</text>
  <text x="89" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Bersihkan HTML</text>
  <path d="M164 48H186" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="188" y="20" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="263" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">split_chapters()</text>
  <text x="263" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">1 file per bagian h2</text>
  <path d="M338 48H360" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="362" y="20" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="437" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">render_chapters()</text>
  <text x="437" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Gambar + tautan bab</text>
  <path d="M512 48H534" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="536" y="20" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="611" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">write_epub()</text>
  <text x="611" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Zip jadi file EPUB</text>
  <path d="M437 78V108" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="362" y="112" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="437" y="130" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">ImageStore.get()</text>
  <text x="437" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">JPEG grayscale</text>
  <path d="M611 110V78" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="536" y="112" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="611" y="130" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">make_cover()</text>
  <text x="611" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Sampul 480×800</text>
</svg>
