<svg width="100%" viewBox="0 0 380 510" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur teknis saat link pendek dibuka, versi mobile</title>
  <desc>public/index.php menerima request GET ke sebuah kode. Untuk setiap request, Router::dispatch() mencocokkan pola URL, LinkController::follow() dipanggil, lalu recordClick() menambah hitungan klik dan mengambil target_url dari SQLite. Jika kode tidak ditemukan, not_found() mengembalikan 404. Jika ada, server membalas 302 ke target_url.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>

  <!-- Titik masuk -->
  <rect x="30" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">public/index.php</text>
  <text x="130" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Terima GET /print</text>

  <line x1="130" y1="76" x2="130" y2="110" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bagian yang berulang -->
  <rect x="16" y="112" width="228" height="282" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="30" y="130" dominant-baseline="central" font-size="12" fill="#52514E">↻ Untuk setiap request link pendek</text>

  <rect x="30" y="146" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Router::dispatch()</text>
  <text x="130" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Cocokkan pola /{kode}</text>

  <line x1="130" y1="202" x2="130" y2="232" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="234" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">follow()</text>
  <text x="130" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Handler di LinkController</text>

  <line x1="130" y1="290" x2="130" y2="320" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="322" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="340" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">recordClick()</text>
  <text x="130" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">clicks + 1, ambil target_url</text>

  <!-- Cabang gagal -->
  <line x1="244" y1="350" x2="258" y2="350" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="260" y="322" width="104" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="312" y="340" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">not_found()</text>
  <text x="312" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Balas 404</text>

  <line x1="130" y1="378" x2="130" y2="428" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hasil -->
  <rect x="30" y="430" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="448" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">302 Location</text>
  <text x="130" y="466" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Ke target_url, no-store</text>
</svg>
