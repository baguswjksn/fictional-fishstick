<svg width="100%" viewBox="0 0 700 330" role="img" style="margin: 0px auto;" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Tahapan di dalam sprite_builder.py, versi desktop</title>
  <desc>collect() mengambil gambar dari folder dan mengurutkannya. Untuk tiap gambar, load_rgba() membukanya dan fit_image() menyamakan ukurannya. File yang rusak dilewati. build_sheet() menumpuk semua gambar jadi satu file, build_css() menghitung posisi tiap gambar, dan build_html() mencetak satu span per gambar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:#898781;stroke:context-stroke;"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">gambar/</text>
  <text x="130" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Folder berisi gambar</text>
  <path d="M220 48H258" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="260" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">collect()</text>
  <text x="350" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Ambil + urutkan</text>
  <path d="M350 76V144" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="26" y="104" width="648" height="110" rx="12" fill="none" stroke="#0B0B0B" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="40" y="122" text-anchor="start" dominant-baseline="central" font-size="12" fill="#52514E">↻ Tiap gambar</text>
  <rect x="40" y="146" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="130" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">[lewati]</text>
  <text x="130" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">File rusak dilewati</text>
  <path d="M260 174H222" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <rect x="260" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">load_rgba()</text>
  <text x="350" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Buka gambarnya</text>
  <path d="M440 174H478" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="480" y="146" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="570" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">fit_image()</text>
  <text x="570" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Samakan ukurannya</text>
  <path d="M570 202V232H130V252" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="40" y="254" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">build_sheet()</text>
  <text x="130" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Tumpuk jadi satu file</text>
  <path d="M220 282H258" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="260" y="254" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">build_css()</text>
  <text x="350" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Hitung posisi tiap gambar</text>
  <path d="M440 282H478" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="480" y="254" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="570" y="272" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">build_html()</text>
  <text x="570" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Satu span per gambar</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
